<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Project Ledger{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">PL</div>
      <div>
        <div class="brand-name">Project Ledger</div>
        <div class="brand-sub">Team delivery tracker</div>
      </div>
    </div>

    <nav class="nav">
      <a href="/" class="nav-item {% if active == 'dashboard' %}is-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="/add" class="nav-item {% if active == 'add' %}is-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        Add Project
      </a>
    </nav>

    <div class="sidebar-foot">
      Summer Internship Project<br>
      Project Management Dashboard
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

</div>

{% block scripts %}{% endblock %}
</body>
</html>
