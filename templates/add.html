{% extends "base.html" %}
{% block title %}Add Project · Project Ledger{% endblock %}

{% block content %}

<div class="page-head">
  <div>
    <h1>Add Project</h1>
    <p>Register a new project so the team can start tracking it.</p>
  </div>
</div>

<div class="form-shell">
  <div class="card-form">
    <form action="/save" method="POST">

      <div class="field">
        <label>Project Name</label>
        <input type="text" name="project_name" placeholder="e.g. Client Portal Redesign" required>
      </div>

      <div class="field">
        <label>Team Leader</label>
        <input type="text" name="team_leader" placeholder="Enter team leader name" required>
      </div>

      <div class="field">
        <label>Number of Team Members</label>
        <input type="number" name="team_members" min="1" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Start Date</label>
          <input type="date" name="start_date" required>
        </div>
        <div class="field">
          <label>Deadline</label>
          <input type="date" name="deadline" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select name="priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select name="status">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Completed</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Project Progress</label>
        <div class="range-row">
          <input type="range" min="0" max="100" value="50" name="progress" oninput="progressValue.value=this.value + '%'">
          <output id="progressValue" class="range-output">50%</output>
        </div>
      </div>

      <div class="form-actions">
        <a href="/" class="btn btn-ghost btn-block">Cancel</a>
        <button type="submit" class="btn btn-accent btn-block">Save Project</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
