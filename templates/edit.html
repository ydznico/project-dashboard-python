{% extends "base.html" %}
{% block title %}Edit Project · Project Ledger{% endblock %}

{% block content %}

<div class="page-head">
  <div>
    <h1>Edit Project</h1>
    <p>Update details for {{ project.project_name }}.</p>
  </div>
</div>

<div class="form-shell">
  <div class="card-form">
    <form action="/update/{{ project.id }}" method="POST">

      <div class="field">
        <label>Project Name</label>
        <input type="text" name="project_name" value="{{ project.project_name }}" required>
      </div>

      <div class="field">
        <label>Team Leader</label>
        <input type="text" name="team_leader" value="{{ project.team_leader }}" required>
      </div>

      <div class="field">
        <label>Number of Team Members</label>
        <input type="number" name="team_members" min="1" value="{{ project.team_members }}" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Start Date</label>
          <input type="date" name="start_date" value="{{ project.start_date }}" required>
        </div>
        <div class="field">
          <label>Deadline</label>
          <input type="date" name="deadline" value="{{ project.deadline }}" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Priority</label>
          <select name="priority">
            <option value="High" {% if project.priority == "High" %}selected{% endif %}>High</option>
            <option value="Medium" {% if project.priority == "Medium" %}selected{% endif %}>Medium</option>
            <option value="Low" {% if project.priority == "Low" %}selected{% endif %}>Low</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select name="status">
            <option value="Pending" {% if project.status == "Pending" %}selected{% endif %}>Pending</option>
            <option value="In Progress" {% if project.status == "In Progress" %}selected{% endif %}>In Progress</option>
            <option value="Completed" {% if project.status == "Completed" %}selected{% endif %}>Completed</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Project Progress</label>
        <div class="range-row">
          <input type="range" min="0" max="100" name="progress" value="{{ project.progress }}" oninput="progressValue.value=this.value + '%'">
          <output id="progressValue" class="range-output">{{ project.progress }}%</output>
        </div>
      </div>

      <div class="form-actions">
        <a href="/" class="btn btn-ghost btn-block">Cancel</a>
        <button type="submit" class="btn btn-accent btn-block">Update Project</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
